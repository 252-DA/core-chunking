[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-chunk"
version = "0.1.0"
description = "Document processing pipeline for RAG systems — parse, chunk, embed, store"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # File type detection
    "python-magic>=0.4.27",
    # Document parsing — PyMuPDF là fast-path mặc định cho PDF text.
    # Docling (OCR/layout, nặng) là optional extra "ocr", xem bên dưới.
    "PyMuPDF>=1.24.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    # Vector DB
    "qdrant-client>=1.9.0",
    # Metadata DB + Graph DB
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "neo4j>=5.28.0",
    # Object storage
    "minio>=7.2.0",
    # Job queue
    "bullmq>=2.0.0",
    "redis>=5.0.0",
    # gRPC
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "protobuf>=4.25.0",
    # HTTP API + Swagger UI
    "fastapi>=0.115.0",
    "uvicorn>=0.35.0",
    "python-multipart>=0.0.20",
    # MCP v1 is the stable line. v2 remains pre-release until 2026-07-28.
    "mcp>=1.27,<2",
    # LLM generation
    "google-genai>=1.67.0",
    "tokenizers>=0.20.0",
    # Utilities
    "numpy>=1.24.0,<2.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    # Logging
    "structlog>=24.1.0",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "opentelemetry-instrumentation-grpc>=0.61b0",
    "prometheus-client>=0.24.1",
    "pydantic-settings>=2.13.1",
]

[project.optional-dependencies]
embeddings = [
    "FlagEmbedding>=1.2.0",
    "sentence-transformers>=2.2.0",
    "openai>=1.0.0",
    # torch chỉ transitive qua FlagEmbedding/sentence-transformers — liệt kê
    # trực tiếp ở đây để tool.uv.sources.torch bên dưới thật sự có hiệu lực
    # (uv chỉ áp override nguồn cho package xuất hiện trực tiếp trong
    # requirement graph của project đang resolve, không tự lan xuống
    # transitive dependency dù trùng tên).
    "torch",
]
llamaindex = [
    "llama-index-core>=0.10.0",
    "llama-index-embeddings-huggingface>=0.3.0",  # cho SemanticSplitter
    "torch",  # transitive qua llama-index-embeddings-huggingface, lý do như trên
]
# DoclingPdfParser — fallback OCR/layout cho scanned PDF khi PyMuPDF không
# đọc được text layer (xem AdaptivePdfParser). Lazy-imported bên trong
# DoclingPdfParser._converter, nên thiếu extra này chỉ làm fallback trả về
# Err(ParseError) thay vì crash — an toàn để bỏ qua khi không cần OCR.
ocr = [
    "docling>=2.0.0",
]
# GrpcEmbedder — gọi embedding-service qua gRPC thay vì load BGE in-process.
# Xem docs/embedding-service-migration.md §5/§8 trong da-platform.
remote-embedding = [
    "da-service-sdk>=0.1.0,<0.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "ipdb>=0.13.13",
]
all = [
    "document-chunk[embeddings,llamaindex,remote-embedding,ocr,dev]",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Local dev path override — chỉ có hiệu lực khi consumer khác (worker,
# mcp-service) cũng khai lại override này ở project root của chính họ. uv
# không tự đọc tool.uv.sources từ pyproject.toml của một path-dependency
# khác. Xem docs/embedding-service-migration.md §5.4.
da-service-sdk = { path = "../service-sdk", editable = true }
# CPU-only wheels — không có GPU passthrough, bản CUDA mặc định tốn ~2GB vô
# ích. Chỉ có hiệu lực vì "torch" đã được liệt kê trực tiếp ở extras
# embeddings/llamaindex phía trên.
torch = [{ index = "pytorch-cpu" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_chunk = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --cov=document_chunk --cov-report=term-missing"
