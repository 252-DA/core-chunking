syntax = "proto3";

package chunking;

// ---------------------------------------------------------------------------
// ChunkingService — document processing + semantic search
// ---------------------------------------------------------------------------

service ChunkingService {
  // Sync: nhận file bytes → parse → chunk → embed → lưu Qdrant + MinIO → trả kết quả ngay
  rpc ProcessDocument(ProcessDocumentRequest) returns (ProcessDocumentResponse);

  // Async: upload file → enqueue BullMQ job → trả về ngay với document_id
  rpc EnqueueDocument(ProcessDocumentRequest) returns (EnqueueDocumentResponse);

  // Poll trạng thái job async
  rpc GetDocumentStatus(GetDocumentStatusRequest) returns (GetDocumentStatusResponse);

  // Lấy lesson cards đã generate cho document
  rpc GetCards(GetCardsRequest) returns (GetCardsResponse);

  // Lấy quiz questions đã generate cho document
  rpc GetQuiz(GetQuizRequest) returns (GetQuizResponse);

  // Semantic search qua vector similarity
  rpc Search(SearchRequest) returns (SearchResponse);

  // Xóa toàn bộ chunks của một document
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // Health check — kiểm tra service còn sống không
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ---------------------------------------------------------------------------
// ProcessDocument
// ---------------------------------------------------------------------------

message ProcessDocumentRequest {
  bytes  file_data    = 1;  // Nội dung file (raw bytes)
  string file_name    = 2;  // Tên file (dùng để detect type: .pdf, .docx, ...)
  string document_id  = 3;  // Optional — tự sinh UUID nếu để trống
  string language     = 4;  // Optional — auto-detect nếu để trống
  map<string, string> metadata = 5;  // Metadata tùy ý (key-value)
}

message ChunkSummary {
  string chunk_id       = 1;
  repeated string heading_path = 2;
  string content_preview = 3;   // 200 ký tự đầu
  int32  content_length  = 4;
  int32  page_number     = 5;   // 0 = không có page
  bool   has_images      = 6;
}

message ProcessDocumentResponse {
  string document_id       = 1;
  string document_name     = 2;
  string doc_type          = 3;  // "pdf" | "docx" | "pptx" | "markdown"
  int32  chunk_count       = 4;
  repeated ChunkSummary chunks = 5;
  string storage_key       = 6;  // MinIO object key của raw file
  float  processing_time_ms = 7;
}

// ---------------------------------------------------------------------------
// EnqueueDocument (async)
// ---------------------------------------------------------------------------

message EnqueueDocumentResponse {
  string document_id = 1;
  string status      = 2;  // "QUEUED"
  string job_id      = 3;  // BullMQ job ID (== document_id)
}

message GetDocumentStatusRequest {
  string document_id = 1;
}

message GetDocumentStatusResponse {
  string document_id = 1;
  string status      = 2;  // "QUEUED" | "PARSING" | "CHUNKING" | "EMBEDDING" | "UPSERTING" | "DONE" | "ENRICHING" | "ENRICHED" | "ERROR"
  string error_msg   = 3;  // populated khi status == "ERROR"
  string storage_key = 4;  // MinIO key, populated sau khi file được upload
}

message GetCardsRequest {
  string document_id = 1;
}

message LessonCard {
  string card_id = 1;
  string chunk_id = 2;
  repeated string heading_path = 3;
  string title = 4;
  repeated string bullets = 5;
  string key_insight = 6;
  int32 card_index = 7;
}

message CardGroup {
  repeated string heading_path = 1;
  repeated LessonCard cards = 2;
}

message GetCardsResponse {
  string document_id = 1;
  repeated CardGroup sections = 2;
  int32 total_cards = 3;
}

message GetQuizRequest {
  string document_id = 1;
}

message QuizItem {
  string question_id = 1;
  string chunk_id = 2;
  string question = 3;
  repeated string choices = 4;
  int32 correct_index = 5;
  string explanation = 6;
  string difficulty = 7;
}

message GetQuizResponse {
  string document_id = 1;
  repeated QuizItem questions = 2;
  int32 total_questions = 3;
}

// ---------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------

message SearchRequest {
  string query           = 1;
  int32  top_k           = 2;  // default 10, max 100
  float  score_threshold = 3;  // 0.0–1.0, default 0.0

  // Filters — tất cả optional, để trống = không lọc
  repeated string doc_types    = 4;  // "pdf", "docx", ...
  repeated string document_ids = 5;
  string language              = 6;
  string course_id             = 7;
  string owner_id              = 8;
}

message SearchResultItem {
  string chunk_id       = 1;
  string document_id    = 2;
  string document_name  = 3;
  string doc_type       = 4;
  repeated string heading_path = 5;
  string content        = 6;
  float  score          = 7;
  int32  rank           = 8;
  int32  page_number    = 9;
}

message SearchResponse {
  string query       = 1;
  repeated SearchResultItem results = 2;
  int32  total_found = 3;
  float  search_time_ms = 4;
}

// ---------------------------------------------------------------------------
// DeleteDocument
// ---------------------------------------------------------------------------

message DeleteDocumentRequest {
  string document_id = 1;
}

message DeleteDocumentResponse {
  bool   success = 1;
  string message = 2;  // Human-readable status
}

// ---------------------------------------------------------------------------
// HealthCheck
// ---------------------------------------------------------------------------

message HealthCheckRequest {}

message HealthCheckResponse {
  string status  = 1;  // "ok" | "degraded"
  string version = 2;
}
